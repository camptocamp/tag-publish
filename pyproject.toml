[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = []
ignore = ["ANN401", "C90", "COM812", "D100", "D104", "D105", "D107", "D200", "D202", "D207", "D208", "D212", "E501", "EM101", "EM102", "ERA001", "FA", "FBT001", "FBT002", "FIX002", "I001", "PERF203", "PLR09", "PLR2004", "Q000", "S101", "S603", "S607", "SIM105", "T201", "TD002", "W293"]
extend-select = ["UP", "I", "S", "B", "ALL"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.extend-per-file-ignores]
"tests/**" = ["ANN", "ARG", "ASYNC", "BLE001", "D", "DTZ", "E722", "FBT003", "INP001", "N", "PGH003", "PLC", "PLR2004", "PLW0603", "PLW1641", "RET", "RUF012", "RUF100", "S104", "S105", "S106", "S108", "S113", "S324", "S603", "S607", "S608", "SLF", "TRY003", "TRY301"]
"**/tests/**" = ["ANN", "ARG", "ASYNC", "BLE001", "D", "DTZ", "E722", "FBT003", "INP001", "N", "PGH003", "PLC", "PLR2004", "PLW0603", "PLW1641", "RET", "RUF012", "RUF100", "S104", "S105", "S106", "S108", "S113", "S324", "S603", "S607", "S608", "SLF", "TRY003", "TRY301"]
"**/test_*.py" = ["ANN", "ARG", "ASYNC", "BLE001", "D", "DTZ", "E722", "FBT003", "INP001", "N", "PGH003", "PLC", "PLR2004", "PLW0603", "PLW1641", "RET", "RUF012", "RUF100", "S104", "S105", "S106", "S108", "S113", "S324", "S603", "S607", "S608", "SLF", "TRY003", "TRY301"]
"**/*_test.py" = ["ANN", "ARG", "ASYNC", "BLE001", "D", "DTZ", "E722", "FBT003", "INP001", "N", "PGH003", "PLC", "PLR2004", "PLW0603", "PLW1641", "RET", "RUF012", "RUF100", "S104", "S105", "S106", "S108", "S113", "S324", "S603", "S607", "S608", "SLF", "TRY003", "TRY301"]

[tool.poetry]
exclude = ["tag_publish/node_modules/**/test"]
version = "0.0.0"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
PyYAML = "6.0.3"
security-md = "1.0.0"
githubkit = "0.14.3"
requests = { version = "2.33.0", optional = true }
twine = { version = "6.2.0", optional = true }
id = { version = "1.5.0", optional = true }
applications-download = { version = "1.7.0", optional = true }
jsonschema-validator-new = { version = "0.3.2", optional = true }
debian-inspector = { version = "31.1.1", optional = true }
multi-repo-automation = { version = "1.7.0", optional = true }
ruamel-yaml = { version = "0.19.1", optional = true }

[tool.poetry.extras]
pypi = ["requests", "twine", "id"]
docker = ["debian-inspector"]
helm = ["applications-download"]
new = ["multi-repo-automation", "ruamel-yaml"]
validation = ["jsonschema-validator-new"]

[tool.poetry.group.dev.dependencies]
prospector = { version = "1.19.1", extras = ["with_bandit", "with_mypy", "with_pyroma", "with_ruff"] }
prospector-profile-duplicated = "1.12.0"
prospector-profile-utils = "1.27.0"
types-requests = "2.33.0.20260712"
types-pyyaml = "6.0.12.20260724"
ruff = "0.16.10"
pylint = "4.0.9"

[tool.poetry-dynamic-versioning]
enable = true
vcs = "git"
pattern = "^(?P<base>\\d+(\\.\\d+)*)"
format-jinja = """
{%- if env.get("VERSION_TYPE") == "default_branch" -%}
{{serialize_pep440(bump_version(base, 1), dev=distance)}}
{%- elif env.get("VERSION_TYPE") == "stabilization_branch" -%}
{{serialize_pep440(bump_version(base, 2), dev=distance)}}
{%- elif distance == 0 -%}
{{serialize_pep440(base)}}
{%- else -%}
{{serialize_pep440(bump_version(base), dev=distance)}}
{%- endif -%}
"""

[tool.poetry-plugin-tweak-dependencies-version]
default = "major"

[project]
classifiers = [
    'Development Status :: 5 - Production/Stable',
    'Environment :: Console',
    'Intended Audience :: Developers',
    'License :: OSI Approved :: MIT License',
    'Operating System :: OS Independent',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Typing :: Typed',
]
dynamic = ["version"]
name = "tag-publish"
description = "Tools used to publish Python packages, Docker images and Helm charts for GitHub tag and branch"
readme = "README.md"
keywords = ["ci"]
license = "FreeBSD"
authors = [{name = "Camptocamp", email = "info@camptocamp.com"}]
packages = [{ include = "tag_publish" }]
include = [
    "tag_publish/py.typed",
    "tag_publish/*.json",
]
requires-python = ">=3.10"
dependencies = ["PyYAML<7,>=6", "security-md<2,>=1", "githubkit<1,>=0"]

[project.optional-dependencies]
pypi = ["requests<3,>=2", "twine<7,>=6", "id<2,>=1"]
docker = ["debian-inspector<32,>=31"]
helm = ["applications-download<2,>=1"]
new = ["multi-repo-automation<2,>=1", "ruamel-yaml<1,>=0"]
validation = ["jsonschema-validator-new<1,>=0"]

[project.urls]
repository = "https://github.com/camptocamp/tag-publish"
"Bug Tracker" = "https://github.com/camptocamp/tag-publish/issues"

[project.scripts]
tag-publish = "tag_publish.cli:main"
tag-publish-new = "tag_publish.new:main"

[build-system]
requires = [
    "poetry-core==2.4.0",
    "poetry-dynamic-versioning[plugin]==1.10.0",
]
build-backend = "poetry.core.masonry.api"
