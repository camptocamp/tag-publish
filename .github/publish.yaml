# yaml-language-server: $schema=../tag_publish/schema.json

pypi:
  versions_type:
    - tag
    - stabilization_branch
    - default_branch
  packages:
    - {}
docker:
  images:
    - name: camptocamp/tag-publish
helm:
  packages:
    - folder: tests
  # The GitHub Releases destination is disabled because `cr upload` attaches the chart to an
  # already published release, and that is rejected by the release immutability option.
  types:
    - oci
node:
  packages:
    - folder: tests
dispatch:
  - {}
