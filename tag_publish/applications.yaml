# Additional applications configuration merged on top of the applications-download
# default configuration, used by tag_publish.download_application.
anchore/syft:
  description: Syft is a CLI tool for generating a CycloneDX SBOM for container images and filesystems
  get-file-name: syft_{short_version}_linux_amd64.tar.gz
  type: tar
  tar-file-name: syft
  to-file-name: syft
  finish-commands:
    - - chmod
      - +x
      - syft
  version-command:
    - syft
    - version
